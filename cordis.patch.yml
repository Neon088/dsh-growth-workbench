# dsh-growth-workbench：会话右侧栏「增长工作台」，事实源是 Obsidian vault 里的 md 笔记。
# 本行插在 profile 的 bundle 层；用户可用自己的 patch 层按 id 覆盖 config（覆盖是整段替换）。
- insert:
    - id: dsh-growth-workbench
      name: 'dsh-growth-workbench'
      config:
        # Obsidian vault 根目录：工作台列/读/写这里的 md 笔记。首次打开面板时会引导填写。
        vaultRoot: ""
        # 各板块在 vault 内的目录名（都可用 ~/.dsh-growth/config.json 覆盖）。
        # sopDir 留空 = 自动检测：vault 根下已有 SOP/ 就用 SOP/，没有就以 vault 根为根。
        sopDir: ""
        workbenchDir: "Workbench"
        copyRulesDir: "CopyRules"
        topicsDir: "Topics"
        campaignsDir: "Campaigns"
        dataDir: "Data"
        feedbackDir: "Feedback"
        productsDir: "Products"
        accountsDir: "Accounts"
        calendarDir: "Calendar"
        # 插件自己的非笔记数据（cards.json）留在本机（不是 vault）。
        pluginDataDir: ""
